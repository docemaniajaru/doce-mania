
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel | Doce Mania</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f3;
      color: #38251f;
      font-family: Arial, sans-serif;
    }
    header {
      background: #6b3027;
      color: white;
      padding: 20px;
    }
    header h1 { margin: 0 0 6px; }
    main { max-width: 900px; margin: auto; padding: 16px; }
    section {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 7px;
      font: inherit;
    }
    input, textarea {
      border: 1px solid #d8c5bb;
      background: white;
      color: #38251f;
    }
    input[type="checkbox"] { width: auto; }
    button {
      border: 0;
      background: #6b3027;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #eadbd3; color: #38251f; }
    button.danger { background: #a52626; }
    .item {
      border: 1px solid #eadbd3;
      padding: 12px;
      border-radius: 9px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }
    .item button { width: auto; margin-right: 5px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hidden { display: none !important; }
    #status {
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      background: #f2e6df;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .hint { color: #705a51; font-size: 14px; }
    @media(max-width: 550px) {
      .row { grid-template-columns: 1fr; }
      .item button { width: 100%; }
    }
  </style>
</head>

<body>
<header>
  <h1>Doce Mania</h1>
  <div>Painel administrativo</div>
</header>

<main>
  <div id="status" role="status">Iniciando painel...</div>

  <section id="loginSection">
    <h2>Entrar</h2>
    <form id="loginForm">
      <label for="email">E-mail cadastrado no Supabase</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar no painel</button>
    </form>
  </section>

  <div id="panel" class="hidden">
    <section>
      <h2>Produtos</h2>
      <p class="hint">Cadastre e atualize os produtos da loja.</p>

      <form id="productForm">
        <input id="productId" type="hidden">

        <label for="name">Nome</label>
        <input id="name" maxlength="120" required>

        <label for="description">Descrição</label>
        <textarea id="description" rows="3"></textarea>

        <div class="row">
          <div>
            <label for="price">Preço (R$)</label>
            <input id="price" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label for="image">Link da imagem (opcional)</label>
            <input id="image" type="url" placeholder="https://...">
          </div>
        </div>

        <label>
          <input id="available" type="checkbox" checked>
          Produto disponível
        </label>

        <button type="submit">Salvar produto</button>
        <button type="button" class="secondary" id="clearProduct">Limpar formulário</button>
      </form>

      <h3>Produtos cadastrados</h3>
      <div id="products"></div>
    </section>

    <section>
      <h2>Taxas de entrega</h2>
      <p class="hint">Cadastre o bairro e o valor da entrega.</p>

      <form id="feeForm">
        <input id="feeId" type="hidden">

        <label for="neighborhood">Bairro ou setor</label>
        <input id="neighborhood" maxlength="120" required>

        <label for="fee">Taxa (R$)</label>
        <input id="fee" type="number" min="0" step="0.01" required>

        <label>
          <input id="active" type="checkbox" checked>
          Região atendida
        </label>

        <button type="submit">Salvar taxa</button>
        <button type="button" class="secondary" id="clearFee">Limpar formulário</button>
      </form>

      <h3>Regiões cadastradas</h3>
      <div id="fees"></div>
    </section>

    <button id="logout" class="secondary">Sair do painel</button>
  </div>
</main>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const status = $('status');
  const loginSection = $('loginSection');
  const panel = $('panel');

  function showStatus(message) {
    status.textContent = message;
  }

  // Diagnostica a configuração sem mostrar a chave na tela.
  const config = window.DOCE_MANIA_CONFIG || {};
  const supabaseUrl =
    window.SUPABASE_URL || config.supabaseUrl || '';
  const supabaseKey =
    window.SUPABASE_PUBLISHABLE_KEY || config.supabaseKey || '';

  if (!window.supabase || !window.supabase.createClient) {
    showStatus(
      'A biblioteca do Supabase não carregou. Verifique a conexão com a internet e tente atualizar a página.'
    );
    return;
  }

  if (!supabaseUrl || !supabaseKey) {
    showStatus(
      'Configuração não encontrada: o painel não recebeu a URL ou a chave pública do supabase-config.js. Confira os nomes das variáveis e se o arquivo foi salvo.'
    );
    return;
  }

  let db;
  try {
    db = window.supabase.createClient(supabaseUrl, supabaseKey);
  } catch (error) {
    showStatus('Não foi possível iniciar o Supabase. Confira a URL e a chave pública no arquivo de configuração.');
    return;
  }

  function setLoggedIn(value) {
    loginSection.classList.toggle('hidden', value);
    panel.classList.toggle('hidden', !value);
  }

  async function verifyAdmin() {
    const { data, error } = await db.auth.getUser();

    if (error || !data.user) {
      setLoggedIn(false);
      showStatus('Entre com seu e-mail e sua senha do Supabase.');
      return false;
    }

    const result = await db
      .from('admin_users')
      .select('user_id')
      .eq('user_id', data.user.id)
      .maybeSingle();

    if (result.error) {
      setLoggedIn(false);
      showStatus('Erro ao verificar administrador: ' + result.error.message);
      return false;
    }

    if (!result.data) {
      setLoggedIn(false);
      showStatus('Este usuário não está cadastrado como administrador na tabela admin_users.');
      return false;
    }

    setLoggedIn(true);
    showStatus('Acesso administrativo confirmado.');
    await Promise.all([loadProducts(), loadFees()]);
    return true;
  }

  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    showStatus('Verificando login...');

    const { error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

    if (error) {
      showStatus('Falha no login: ' + error.message);
      return;
    }

    await verifyAdmin();
  });

  function money(value) {
    return Number(value).toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });
  }

  function addText(parent, tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    parent.appendChild(element);
    return element;
  }

  async function loadProducts() {
    showStatus('Carregando produtos...');

    const { data, error } = await db
      .from('products')
      .select('*')
      .order('id', { ascending: false });

    if (error) {
      showStatus('Erro ao carregar produtos: ' + error.message);
      return;
    }

    const root = $('products');
    root.replaceChildren();

    if (!data.length) {
      addText(root, 'p', 'Nenhum produto cadastrado no Supabase ainda.');
      showStatus('Painel conectado. Cadastre seu primeiro produto.');
      return;
    }

    data.forEach(product => {
      const item = document.createElement('div');
      item.className = 'item';

      addText(item, 'strong', product.name + ' — ' + money(product.price));
      addText(
        item,
        'p',
        (product.available ? 'Disponível' : 'Indisponível') +
        (product.description ? ' · ' + product.description : '')
      );

      const edit = addText(item, 'button', 'Editar');
      edit.onclick = () => {
        $('productId').value = product.id;
        $('name').value = product.name || '';
        $('description').value = product.description || '';
        $('price').value = product.price;
        $('image').value = product.image_url || '';
        $('available').checked = !!product.available;
        $('productForm').scrollIntoView({ behavior: 'smooth' });
      };

      const toggle = addText(item, 'button', product.available ? 'Desativar' : 'Ativar');
      toggle.className = 'secondary';
      toggle.onclick = () => saveProduct({
        ...product,
        available: !product.available
      });

      const remove = addText(item, 'button', 'Excluir');
      remove.className = 'danger';
      remove.onclick = () => deleteProduct(product);

      root.appendChild(item);
    });

    showStatus('Produtos carregados.');
  }

  async function saveProduct(product) {
    const payload = {
      name: product.name,
      description: product.description || '',
      price: Number(product.price),
      image_url: product.image_url || '',
      available: !!product.available
    };

    showStatus('Salvando produto...');

    const result = product.id
      ? await db.from('products').update(payload).eq('id', product.id)
      : await db.from('products').insert(payload);

    if (result.error) {
      showStatus('Erro ao salvar produto: ' + result.error.message);
      return;
    }

    $('productForm').reset();
    $('productId').value = '';
    $('available').checked = true;
    showStatus('Produto salvo com sucesso.');
    await loadProducts();
  }

  $('productForm').addEventListener('submit', async event => {
    event.preventDefault();

    await saveProduct({
      id: $('productId').value || null,
      name: $('name').value.trim(),
      description: $('description').value.trim(),
      price: $('price').value,
      image_url: $('image').value.trim(),
      available: $('available').checked
    });
  });

  async function deleteProduct(product) {
    if (!confirm('Excluir o produto "' + product.name + '"?')) return;

    const { error } = await db
      .from('products')
      .delete()
      .eq('id', product.id);

    if (error) {
      showStatus('Erro ao excluir produto: ' + error.message);
      return;
    }

    showStatus('Produto excluído.');
    await loadProducts();
  }

  $('clearProduct').onclick = () => {
    $('productForm').reset();
    $('productId').value = '';
    $('available').checked = true;
  };

  async function loadFees() {
    showStatus('Carregando taxas...');

    const { data, error } = await db
      .from('delivery_fees')
      .select('*')
      .order('neighborhood');

    if (error) {
      showStatus('Erro ao carregar taxas: ' + error.message);
      return;
    }

    const root = $('fees');
    root.replaceChildren();

    if (!data.length) {
      addText(root, 'p', 'Nenhuma taxa cadastrada no Supabase ainda.');
      showStatus('Taxas carregadas. Cadastre as regiões de entrega.');
      return;
    }

    data.forEach(fee => {
      const item = document.createElement('div');
      item.className = 'item';

      addText(item, 'strong', fee.neighborhood + ' — ' + money(fee.fee));
      addText(item, 'p', fee.active ? 'Região atendida' : 'Região desativada');

      const edit = addText(item, 'button', 'Editar');
      edit.onclick = () => {
        $('feeId').value = fee.id;
        $('neighborhood').value = fee.neighborhood;
        $('fee').value = fee.fee;
        $('active').checked = !!fee.active;
        $('feeForm').scrollIntoView({ behavior: 'smooth' });
      };

      const toggle = addText(item, 'button', fee.active ? 'Desativar' : 'Ativar');
      toggle.className = 'secondary';
      toggle.onclick = () => saveFee({ ...fee, active: !fee.active });

      const remove = addText(item, 'button', 'Excluir');
      remove.className = 'danger';
      remove.onclick = () => deleteFee(fee);

      root.appendChild(item);
    });

    showStatus('Taxas carregadas.');
  }

  async function saveFee(fee) {
    const payload = {
      neighborhood: fee.neighborhood,
      fee: Number(fee.fee),
      active: !!fee.active
    };

    showStatus('Salvando taxa...');

    const result = fee.id
      ? await db.from('delivery_fees').update(payload).eq('id', fee.id)
      : await db.from('delivery_fees').insert(payload);

    if (result.error) {
      showStatus('Erro ao salvar taxa: ' + result.error.message);
      return;
    }

    $('feeForm').reset();
    $('feeId').value = '';
    $('active').checked = true;
    showStatus('Taxa salva com sucesso.');
    await loadFees();
  }

  $('feeForm').addEventListener('submit', async event => {
    event.preventDefault();

    await saveFee({
      id: $('feeId').value || null,
      neighborhood: $('neighborhood').value.trim(),
      fee: $('fee').value,
      active: $('active').checked
    });
  });

  async function deleteFee(fee) {
    if (!confirm('Excluir a taxa de "' + fee.neighborhood + '"?')) return;

    const { error } = await db
      .from('delivery_fees')
      .delete()
      .eq('id', fee.id);

    if (error) {
      showStatus('Erro ao excluir taxa: ' + error.message);
      return;
    }

    showStatus('Taxa excluída.');
    await loadFees();
  }

  $('clearFee').onclick = () => {
    $('feeForm').reset();
    $('feeId').value = '';
    $('active').checked = true;
  };

  $('logout').onclick = async () => {
    await db.auth.signOut();
    setLoggedIn(false);
    showStatus('Você saiu do painel.');
  };

  try {
    await verifyAdmin();
  } catch (error) {
    showStatus('Erro inesperado no painel. Atualize a página e tente novamente.');
  }
})();
</script>
</body>
</html>
