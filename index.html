<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b1737">
<meta name="description" content="Peça seus doces favoritos na Doce Mania, em Jaru-RO.">
<link rel="manifest" href="manifest.json">
<title>Doce Mania | Peça aqui</title>

<style>
:root{--wine:#6b1737;--pink:#f7dce5;--cream:#fffaf7;--gold:#d5a34b;--ink:#34242a;--muted:#796c70}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,#6b1737,#8e2a4e);color:white;padding:26px 18px 32px;border-radius:0 0 24px 24px}
.wrap{max-width:1000px;margin:auto;padding:0 16px}
header .top{display:flex;align-items:center;gap:14px}
.logo{width:76px;height:76px;object-fit:contain;border:1px solid #e9c47c;border-radius:14px;background:#fff;padding:2px}
.brand{font-size:26px;font-weight:850;letter-spacing:.2px}
.sub{opacity:.88;font-size:14px}
.hero{margin-top:22px}
.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.08;margin:0 0 10px}
.hero p{margin:0;max-width:600px;color:#f7e8ed}
main{padding:24px 0 110px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.search{flex:1;min-width:180px;padding:12px 14px;border:1px solid #eadde1;border-radius:12px;font-size:15px;background:white}
.section-title{font-size:21px;margin:20px 0 12px}
.category-list{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;margin-bottom:8px;scrollbar-width:thin}
.category-list button{flex:0 0 auto;background:white;color:var(--wine);border:1px solid #eadde1;border-radius:24px;padding:10px 15px}
.category-list button.active{background:var(--wine);color:white}
.category-list button:disabled{opacity:.6}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.product{
 background:white;
 border:1px solid #f0e3e6;
 border-radius:17px;
 overflow:hidden;
 box-shadow:0 4px 16px #4a102008;
 display:flex;
 flex-direction:column;
 min-width:0;
}
.food-art{
 width:100%;
 height:200px;
 flex:0 0 200px;
 background:radial-gradient(circle at 30% 30%,#fff6d9,#f6dbe3 58%,#e7b6c7);
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 font-size:55px;
}
.food-image{
 display:block;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
}
.product-body{
 position:relative;
 display:flex;
 flex-direction:column;
 flex:1;
 min-width:0;
 padding:14px;
 background:#fff;
}
.product h3{
 position:static;
 display:block;
 margin:0 0 8px;
 font-size:17px;
 line-height:1.35;
 overflow-wrap:anywhere;
}
.desc{
 display:block;
 position:static;
 font-size:14px;
 line-height:1.45;
 color:var(--muted);
 min-height:40px;
 overflow-wrap:anywhere;
}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:14px}
.price{font-size:18px;font-weight:800;color:var(--wine)}
button{border:0;cursor:pointer;font-weight:700;border-radius:11px;padding:11px 14px}
.add,.primary{background:var(--wine);color:white}
.secondary{background:var(--pink);color:var(--wine)}
.cart-panel{margin-top:26px;background:white;border:1px solid #eadde1;border-radius:18px;padding:18px}
.cart-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3e9ec}
.cart-row:last-child{border-bottom:0}
.cart-name{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:5px 10px;background:#f7e8ed;color:var(--wine)}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:850;margin:15px 0}
.checkout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:#5c4149}
input,select,textarea{width:100%;border:1px solid #e6d6dc;border-radius:10px;padding:11px;font:inherit;background:#fff}
textarea{min-height:74px;resize:vertical}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);padding:12px 0}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:#fffdfc;border-top:1px solid #eadde1;padding:10px 16px;display:flex;justify-content:center;z-index:3}
.sticky button{width:min(100%,968px);display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;background:#f8e8ed;color:var(--wine);border-radius:30px;padding:5px 9px}
.status{font-size:12px;color:var(--muted);margin:0 0 12px}

@media(max-width:560px){
 .checkout{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .brand{font-size:23px}
 .cart-panel{padding:14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .food-art{height:150px;flex-basis:150px;font-size:43px}
 .product-body{padding:11px}
 .product h3{font-size:15px}
 .desc{font-size:12px;min-height:36px}
 .bottom{align-items:stretch;flex-direction:column}
 .price{font-size:17px}
 .add{width:100%}
}
</style>
</head>
